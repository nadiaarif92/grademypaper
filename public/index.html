<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Grader & Reporting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-p-6">
    <div class="max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-xl my-10">
        <header class="border-b pb-4 mb-6">
            <h1 class="text-3xl font-extrabold text-blue-600">🎓 Multi-Board AI Exam Grader</h1>
            <p class="text-sm text-slate-500 mt-1">Upload question papers, marking schemes, and student answers for precise AI evaluation.</p>
        </header>

        <form id="gradingForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Exam Board</label>
                    <select name="board" id="board" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="Cambridge (CAIE)">Cambridge (CAIE)</option>
                        <option value="Edexcel (Pearson)">Edexcel (Pearson)</option>
                        <option value="AQA">AQA</option>
                        <option value="IB (International Baccalaureate)">IB</option>
                        <option value="AP (Advanced Placement)">AP</option>
                        <option value="Other Board">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Grade / Level</label>
                    <input type="text" name="grade" id="grade" placeholder="e.g. Year 11, Grade 10, A-Level" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Subject</label>
                    <input type="text" name="subject" id="subject" placeholder="e.g. Physics, Mathematics" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border">
                <div>
                    <label class="block text-sm font-semibold mb-1">1. Question Paper (PDF/Img)</label>
                    <input type="file" name="questionPaper" accept=".pdf,image/*" required class="text-xs w-full text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">2. Marking Scheme (PDF/Img)</label>
                    <input type="file" name="markingScheme" accept=".pdf,image/*" required class="text-xs w-full text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">3. Student Solution (PDF/Img)</label>
                    <input type="file" name="studentSolution" accept=".pdf,image/*" required class="text-xs w-full text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition duration-200 shadow-md">
                Evaluate & Generate Marked Report
            </button>
        </form>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-3 text-slate-600 font-medium">Gemini is analyzing documents and grading script...</p>
        </div>

        <!-- Results Display Section -->
        <div id="results" class="hidden mt-8 border-t pt-6 space-y-6">
            <div class="flex justify-between items-center bg-blue-50 p-4 rounded-xl border border-blue-100">
                <div>
                    <h2 class="text-xl font-bold text-blue-900">Evaluation Summary</h2>
                    <p id="resGeneral" class="text-sm text-blue-800 mt-1"></p>
                </div>
                <div class="text-right">
                    <div class="text-3xl font-black text-blue-600"><span id="resScore"></span>/<span id="resMax"></span></div>
                    <div class="text-sm font-bold text-slate-600">Grade: <span id="resGrade" class="text-emerald-600 text-lg"></span></div>
                </div>
            </div>

            <div>
                <h3 class="text-lg font-bold mb-3">Question-by-Question Breakdown</h3>
                <div id="breakdownList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('gradingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch('/api/grade', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Failed to process grading request.');

                const ev = data.evaluation;
                document.getElementById('resScore').innerText = ev.totalScoreAwarded;
                document.getElementById('resMax').innerText = ev.maxPossibleScore;
                document.getElementById('resGrade').innerText = ev.estimatedGrade;
                document.getElementById('resGeneral').innerText = ev.generalFeedback;

                const listContainer = document.getElementById('breakdownList');
                listContainer.innerHTML = '';

                ev.questionBreakdown.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border ${item.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}`;
                    card.innerHTML = `
                        <div class="flex justify-between font-bold mb-1">
                            <span>Question ${item.questionNumber}</span>
                            <span class="${item.isCorrect ? 'text-emerald-700' : 'text-amber-700'}">Marks: ${item.marksAwarded} / ${item.maxMarks}</span>
                        </div>
                        <p class="text-sm text-slate-700">${item.examinerNotes}</p>
                    `;
                    listContainer.appendChild(card);
                });

                document.getElementById('results').classList.remove('hidden');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
